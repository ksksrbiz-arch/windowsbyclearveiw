name: One-time photo hero migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Replace remaining AI hero references
        shell: python
        run: |
          from pathlib import Path
          stock = 'https://images.pexels.com/photos/13600834/pexels-photo-13600834.jpeg?auto=compress&cs=tinysrgb&w=2400'

          new_build = Path('src/pages/new-construction.astro')
          text = new_build.read_text()
          replacements = {
              "import newConstructionHeroSrc from '../assets/hero/new-construction.png';\n": '',
              "// Full-bleed hero background. AI-generated, not a real job site, so it is\n// captioned as such — the same rule the guide photos already follow.\nconst heroBg = await getImage({ src: newConstructionHeroSrc, width: 2400, format: 'webp', quality: 76 });": "// Use the actual Clearview new-construction job already shown in the\n// gallery below.\nconst heroPhoto = findWork('new-build-sheathed-garage')!;\nconst heroBg = await getImage({ src: heroPhoto.image, width: 2400, format: 'webp', quality: 76 });",
              '<p class="hero-photo-credit">AI-generated imagery — not an actual Clearview job or job site</p>': '<p class="hero-photo-credit">Clearview job photo — set and flashed, two-story new build</p>',
          }
          for old, new in replacements.items():
              if old not in text: raise SystemExit(f'new-construction pattern not found: {old[:80]!r}')
              text = text.replace(old, new)
          new_build.write_text(text)

          doors = Path('src/pages/sliding-glass-doors.astro')
          text = doors.read_text()
          replacements = {
              "import { getImage } from 'astro:assets';\n": '',
              "import slidingDoorsHeroSrc from '../assets/hero/sliding-glass-doors.png';\n": '',
              "// Full-bleed hero background. AI-generated, not a real elevation, so it is\n// captioned as such — the same rule the other service-page heroes follow\n// (replacement.astro, new-construction.astro, window-features.astro).\nconst heroBg = await getImage({ src: slidingDoorsHeroSrc, width: 2400, format: 'webp', quality: 76 });": f"// There is not a completed Clearview patio-door photo yet. Use a truthful\n// stock example rather than an AI rendering, and label it below.\nconst heroBg = {{ src: '{stock}' }};",
              '<p class="hero-photo-credit">AI-generated imagery — not an actual Clearview job or job site</p>': '<p class="hero-photo-credit">Stock photography — patio door example; not a Clearview job</p>',
          }
          for old, new in replacements.items():
              if old not in text: raise SystemExit(f'sliding-glass-doors pattern not found: {old[:80]!r}')
              text = text.replace(old, new)
          doors.write_text(text)

          home = Path('src/pages/index.astro')
          text = home.read_text()
          marker = "const newBuildTile = findWork('new-build-sheathed-garage')!;\n"
          if marker not in text: raise SystemExit('homepage marker not found')
          text = text.replace(marker, marker + f"\nconst stock = '{stock}';\n", 1)
          replacements = {
              "import slidingDoorsTileSrc from '../assets/hero/sliding-glass-doors.png';\n": '',
              "// The sliding-doors tile has no real installed-job photo yet (see\n// sliding-glass-doors.astro), so unlike the two tiles above it borrows the\n// same AI-generated hero image that page uses. TODO: swap for a real\n// installed-job photo once one exists, same as the other two tiles.\nconst slidingDoorsTile = await getImage({ src: slidingDoorsTileSrc, width: 900, format: 'webp', quality: 72 });": "// There is not a completed Clearview patio-door photo yet, so use the\n// same truthful stock example as the service page.\nconst slidingDoorsTile = { src: stock };",
              '<span class="tile-badge">Concept imagery</span>': '<span class="tile-badge">Stock photo</span>',
          }
          for old, new in replacements.items():
              if old not in text: raise SystemExit(f'homepage pattern not found: {old[:80]!r}')
              text = text.replace(old, new)
          home.write_text(text)

      - name: Remove this one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/ux-photo-hero-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/new-construction.astro src/pages/sliding-glass-doors.astro src/pages/index.astro .github/workflows/ux-photo-hero-migration.yml
          git diff --cached --quiet || git commit -m 'Replace remaining concept hero imagery with truthful photography'
          git push
