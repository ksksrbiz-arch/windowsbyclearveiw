name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run test:icm
      - run: npm run test:build-plan-state
      - run: npm run test:build-plan-integration
      - run: npm run test:production-hardening
      - run: npm run test:marketing-platform
      - run: npm run test:ask-security
      - run: npm run eval:build-plan
      - run: npm run build
