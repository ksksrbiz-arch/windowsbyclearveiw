name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run test:icm
      - run: npm run test:icm-structure
      - run: npm run test:build-plan-state
      - run: npm run test:build-plan-integration
      - run: npm run test:production-hardening
      - run: npm run test:marketing-platform
      - run: npm run test:ask-security
      - run: npm run test:ask-pricing
      - run: npm run test:ask-handoff
      - run: npm run test:ask-logs
      - run: npm run test:command-center
      - run: npm run test:siding-work
      - run: npm run test:recent-fixes
      - run: npm run test:public-terminology
      - run: npm run test:copilot
      - run: npm run test:ai-surfaces
      - run: npm run test:google-reviews
      - run: npm run test:analytics
      - run: npm run test:permit-leads
      - run: npm run test:mail-pilot
      - run: npm run test:estimate
      - run: npm run test:quote-to-job
      - run: npm run test:lead-links
      - run: npm run test:quote-follow-ups
      - run: npm run test:quote-signing
      - run: npm run test:review-request
      - run: npm run eval:build-plan
      - run: npm run build
      - run: npm run test:window-studio
      - run: npm run test:seo
      - run: npm run test:siding
      - run: npm run test:pricing-health
      - run: npm run test:form-patterns
      - run: npm run test:charts
      - run: npm run test:internal-styles
      - run: npm run test:internal-mobile
      - run: npm run test:internal-pwa
      - run: npm run test:job-photos
      - run: npm run test:photo-sync
      - run: npm run test:abuse-guard
      - run: npm run test:ops-cron
      - run: npm run test:access
      - run: npm run test:embeddings
      - run: npm run test:dashboard-first-run
      - run: npm run test:field-photo-db
      - run: npm run test:general-jobs
      - run: npm run test:contact-import
