# The pricing worker's own monthly cron trigger runs directly on Cloudflare
# (the [triggers] block in workers/pricing/wrangler.toml is live). This
# workflow is a belt-and-suspenders check from GitHub Actions: a failure here
# shows up in the repo even if the worker's own cron, or its reminder email,
# ever silently stops firing.
#
# Safe to delete if that redundancy isn't worth keeping.

name: Pricing health

on:
  schedule:
    # 09:00 America/Los_Angeles on the 1st of each month (16:00 UTC).
    - cron: '0 16 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask the pricing worker how it is doing
        env:
          PRICING_ENDPOINT: https://clearveiw-pricing.skdev-371.workers.dev
        run: |
          set -euo pipefail
          echo "Checking $PRICING_ENDPOINT/health"
          curl -sS --max-time 20 "$PRICING_ENDPOINT/health" -o health.json
          cat health.json
          echo
          python3 .github/scripts/check_pricing_health.py health.json
