# Mark's installed pricing lives in src/data/pricing.ts and goes stale. This
# checks the numbers the site actually ships — it builds the site and validates
# the pricing model the calculator serialises into the page, which is the same
# document the estimator prices from.
#
# It used to poll a Cloudflare Worker that held a copy of the pricing. That
# worker was never wired to the site and never had anything stored, so it was
# deleted; the freshness reminder it existed to provide is worth keeping, and
# does not need a worker to work.

name: Pricing health

on:
  schedule:
    # 09:00 America/Los_Angeles on the 1st of each month (16:00 UTC).
    - cron: '0 16 1 * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/data/pricing.ts'
      - 'shared/pricing-schema.mjs'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build so the shipped pricing model can be read back
        run: npm run build

      - name: Validate the pricing the site actually serves
        run: node .github/scripts/check-pricing.mjs
