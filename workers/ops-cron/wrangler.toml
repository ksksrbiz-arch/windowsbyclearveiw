# Companion Worker: scheduled jobs (nightly D1 backup, weekday follow-up nudge).
# Deployed separately from the Pages site:  cd workers/ops-cron && npx wrangler deploy
# Bindings here are real (unlike the repo-root wrangler.toml, which is local-dev only).
# Secrets (set once, never committed):
#   npx wrangler secret put LEAD_ALERT_NTFY_TOPIC   # same value as the Pages project
#   (optional) LEAD_ALERT_NTFY_SERVER, LEAD_ALERT_NTFY_TOKEN
name = "clearview-ops-cron"
main = "src/index.js"
compatibility_date = "2026-08-21"
workers_dev = false
preview_urls = false

[triggers]
crons = ["15 10 * * *", "30 15 * * 1-5"]

[[d1_databases]]
binding = "QUOTES_DB"
database_name = "clearveiw-quotes"
database_id = "5bd299fc-0ca2-4d75-94f5-95c3943e9d79"

[[r2_buckets]]
binding = "DB_BACKUPS"
bucket_name = "clearview-db-backups"

[observability]
enabled = true
